name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Every module parses
        run: |
          for f in book.js scan.js build-venues.js lib/*.js; do
            node --check "$f"
          done

      - name: Shipped data is valid and carries no credentials
        run: |
          for f in data/*.json config.json.sample; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
          ! grep -rIniE '"(password|email)"[[:space:]]*:[[:space:]]*"[^"]+"' data/ config.json.sample

      # Planning phase end to end: target days, season, hour choice, decision.json.
      # Does not touch the booking site, so it is safe to run on every push.
      - name: Planning phase runs end to end
        run: |
          cp config.json.sample config.json
          node scan.js --plan-only
          node -e "
            const d = JSON.parse(require('fs').readFileSync('decision.json','utf8'));
            if (!d.days?.length) throw new Error('no target days');
            for (const x of d.days) if (!x.hours?.length || !x.courtType) throw new Error('incomplete plan for ' + x.date);
            console.log(d.days.map(x => x.date + ' ' + x.courtType + ' ' + x.hours.join('/')).join('; '));
          "

      - name: Sample config keeps the booker dormant
        run: |
          cp config.json.sample config.json
          node book.js | tee /tmp/out
          grep -q 'dormant' /tmp/out

      - name: Booking phase refuses to run without credentials
        run: |
          # Capture node's exit code directly; a pipe to tee would swallow it.
          set +e
          node book.js --dry-run > /tmp/out 2>&1
          rc=$?
          cat /tmp/out
          if [ "$rc" -eq 0 ]; then echo "expected a non-zero exit, got 0"; exit 1; fi
          grep -q 'ACCOUNT_EMAIL and ACCOUNT_PASSWORD must be set' /tmp/out
